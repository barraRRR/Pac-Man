[project]
name = "Pac_Man"
description= "The mighty arcade game, now in Python. Wacka! Wacka!."
version = "v1.0.0"
requires-python = "==3.10.*"
dependencies = [
    "flake8",
    "mazegenerator",
    "mypy",
    "pydantic",
    "pygame==2.6.1",
]

[tool.uv.sources]
mazegenerator = {
    path = "wheels/mazegenerator-2.1.0-py3-none-any.whl"
    }

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
]

